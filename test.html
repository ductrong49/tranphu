<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Thời Khóa Biểu Năm Học 2026-2027</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdfbf7;
            background-image: 
                linear-gradient(#e8e8e8 1px, transparent 1px),
                linear-gradient(90deg, #e8e8e8 1px, transparent 1px);
            background-size: 20px 20px;
            color: #444;
            padding: 10px;
            line-height: 1.5;
            text-align: center;
        }

        .container { max-width: 100%; margin: 0 auto; }

        .header {
            margin-bottom: 20px;
            padding: 15px 10px;
            background: #ffffff;
            border-radius: 12px;
            border: 2px solid #e3f2fd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .header h1 {
            color: #1565c0;
            font-size: 1.5em;
            font-weight: 800;
            margin-bottom: 3px;
        }

        .header-subtitle {
            color: #64b5f6;
            font-size: 1em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .week-info {
            display: inline-block;
            background: #fff3e0;
            color: #e65100;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.95em;
            margin-bottom: 10px;
        }

        .datetime {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .date-display { font-size: 1em; font-weight: 700; color: #333; }
        .time-display { font-size: 1em; font-weight: 700; color: #e65100; }
        .datetime-separator { color: #ccc; font-weight: 300; }

        .last-update {
            font-size: 0.75em;
            color: #888;
            margin-top: 8px;
            font-style: italic;
        }

        .class-section {
            margin-bottom: 25px;
            background: #ffffff;
            border-radius: 12px;
            padding: 15px 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .class-title {
            font-size: 1.3em;
            font-weight: 800;
            margin-bottom: 15px;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .class-7a6 { border-top: 4px solid #f48fb1; }
        .class-7a6 .class-title { color: #c2185b; border-bottom: 2px dashed #f8bbd0; }

        .class-9a9 { border-top: 4px solid #4fc3f7; }
        .class-9a9 .class-title { color: #0277bd; border-bottom: 2px solid #b3e5fc; }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.85em;
            margin: 0 auto;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 8px 4px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background: #f5f7fa;
            color: #546e7a;
            font-weight: 700;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .class-7a6 .session-morning {
            background-color: #ec407a !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }
        .class-9a9 .session-morning {
            background-color: #0288d1 !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }

        .class-7a6 .session-afternoon {
            background-color: #880e4f !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }
        .class-9a9 .session-afternoon {
            background-color: #01579b !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }

        .afternoon-start td {
            border-top: 4px solid #546e7a !important;
        }

        .class-7a6 .morning-odd td {
            background-color: #fce4ec;
            color: #880e4f;
            font-weight: 700;
        }
        .class-9a9 .morning-odd td {
            background-color: #e1f5fe;
            color: #01579b;
            font-weight: 700;
        }

        .class-7a6 .morning-even td,
        .class-9a9 .morning-even td {
            background-color: #ffffff;
            color: #444;
            font-weight: 700;
        }

        .class-7a6 .afternoon-odd td {
            background-color: #f8bbd0;
            color: #880e4f;
            font-weight: 700;
        }
        .class-9a9 .afternoon-odd td {
            background-color: #b3e5fc;
            color: #01579b;
            font-weight: 700;
        }

        .class-7a6 .afternoon-even td,
        .class-9a9 .afternoon-even td {
            background-color: #f5f5f5;
            color: #444;
            font-weight: 700;
        }

        .empty-cell {
            color: #bdbdbd !important;
            font-weight: 400 !important;
        }

        .current-day-header {
            background-color: #fff3e0 !important;
            color: #e65100 !important;
            border: 2px solid #ffb74d !important;
            font-weight: 800;
            position: relative;
        }
        .current-day-header::after {
            content: '📍';
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 0.9em;
            background: white;
            border-radius: 50%;
            padding: 2px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.1em;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #c62828;
        }

        .footer {
            margin-top: 25px;
            padding: 15px;
            color: #888;
            font-size: 0.85em;
        }

        @media (max-width: 768px) {
            body { padding: 5px; }
            .header { padding: 12px 8px; margin-bottom: 15px; }
            .header h1 { font-size: 1.2em; }
            .header-subtitle { font-size: 0.9em; }
            .week-info { font-size: 0.85em; padding: 3px 12px; }
            .datetime { gap: 10px; }
            .date-display, .time-display { font-size: 0.85em; }
            .class-section { padding: 10px 5px; margin-bottom: 20px; }
            .class-title { font-size: 1.1em; margin-bottom: 10px; }
            table { font-size: 0.7em; }
            th, td { padding: 6px 2px; }
            .footer { font-size: 0.75em; padding: 10px; }
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.1em; }
            table { font-size: 0.65em; }
            th, td { padding: 5px 1px; }
            .datetime { flex-direction: column; gap: 5px; }
            .datetime-separator { display: none; }
        }

        @media print {
            body { background: white; padding: 0; }
            .class-section, .header { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Lớp 7A6 -->

        <div class="footer">
            <p>Dữ liệu được cập nhật tự động từ Google Sheets 🔄</p>

    <script>
        // Google Sheets Configuration
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSPcpB9A2glEjMqqQpekznvgWJ1jcvif5rYOhTVkCbI6yrMVj7hD1wyNqXeCSyWx0Tcmc9-PlbC9LQO/pub?gid=859933321&single=true&output=csv';
        
        let lastDataHash = '';
        let lastUpdateTime = null;

        // Parse CSV
        function parseCSV(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line);
            const result = [];
            
            for (let line of lines) {
                const row = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                row.push(current.trim());
                result.push(row);
            }
            
            return result;
        }

        // Get cell value safely
        function getCell(data, row, col) {
            if (data[row] && data[row][col]) {
                return data[row][col].trim();
            }
            return '';
        }

        // Check if cell is empty
        function isEmpty(value) {
            return !value || value === '' || value === '-' || value === '​';
        }

        // Create table row HTML
        function createRowHTML(cells, periodClass, isAfternoonStart = false) {
            const rowClass = isAfternoonStart ? `${periodClass} afternoon-start` : periodClass;
            let html = `<tr class="${rowClass}">`;
            
            cells.forEach((cell, index) => {
                if (index === 0) {
                    // First cell (Sáng/Chiều label)
                    const sessionClass = cell.toLowerCase().includes('sáng') || cell.toLowerCase().includes('sang') ? 'session-morning' : 'session-afternoon';
                    html += `<td rowspan="5" class="${sessionClass}">${cell}</td>`;
                } else if (isEmpty(cell)) {
                    html += `<td class="empty-cell">-</td>`;
                } else {
                    html += `<td>${cell}</td>`;
                }
            });
            
            html += '</tr>';
            return html;
        }

        // Load and render data for class 7A6
        function loadClass7A6(data) {
            const tbody = document.getElementById('tbody-7a6');
            let html = '';
            
            // Morning sessions (rows 4-8 in CSV, index 4-8)
            // Row 4: Headers, Row 5-9: Morning sessions
            const morningRows = [
                [getCell(data, 4, 0), getCell(data, 4, 1), getCell(data, 4, 2), 
                 getCell(data, 4, 3), getCell(data, 4, 4), getCell(data, 4, 5), 
                 getCell(data, 4, 6), getCell(data, 4, 7), getCell(data, 4, 8)],
                [getCell(data, 5, 0), getCell(data, 5, 1), getCell(data, 5, 2), 
                 getCell(data, 5, 3), getCell(data, 5, 4), getCell(data, 5, 5), 
                 getCell(data, 5, 6), getCell(data, 5, 7), getCell(data, 5, 8)],
                [getCell(data, 6, 0), getCell(data, 6, 1), getCell(data, 6, 2), 
                 getCell(data, 6, 3), getCell(data, 6, 4), getCell(data, 6, 5), 
                 getCell(data, 6, 6), getCell(data, 6, 7), getCell(data, 6, 8)],
                [getCell(data, 7, 0), getCell(data, 7, 1), getCell(data, 7, 2), 
                 getCell(data, 7, 3), getCell(data, 7, 4), getCell(data, 7, 5), 
                 getCell(data, 7, 6), getCell(data, 7, 7), getCell(data, 7, 8)],
                [getCell(data, 8, 0), getCell(data, 8, 1), getCell(data, 8, 2), 
                 getCell(data, 8, 3), getCell(data, 8, 4), getCell(data, 8, 5), 
                 getCell(data, 8, 6), getCell(data, 8, 7), getCell(data, 8, 8)]
            ];
            
            // Afternoon sessions (rows 9-13 in CSV, index 9-13)
            const afternoonRows = [
                [getCell(data, 9, 0), getCell(data, 9, 1), getCell(data, 9, 2), 
                 getCell(data, 9, 3), getCell(data, 9, 4), getCell(data, 9, 5), 
                 getCell(data, 9, 6), getCell(data, 9, 7), getCell(data, 9, 8)],
                [getCell(data, 10, 0), getCell(data, 10, 1), getCell(data, 10, 2), 
                 getCell(data, 10, 3), getCell(data, 10, 4), getCell(data, 10, 5), 
                 getCell(data, 10, 6), getCell(data, 10, 7), getCell(data, 10, 8)],
                [getCell(data, 11, 0), getCell(data, 11, 1), getCell(data, 11, 2), 
                 getCell(data, 11, 3), getCell(data, 11, 4), getCell(data, 11, 5), 
                 getCell(data, 11, 6), getCell(data, 11, 7), getCell(data, 11, 8)],
                [getCell(data, 12, 0), getCell(data, 12, 1), getCell(data, 12, 2), 
                 getCell(data, 12, 3), getCell(data, 12, 4), getCell(data, 12, 5), 
                 getCell(data, 12, 6), getCell(data, 12, 7), getCell(data, 12, 8)],
                [getCell(data, 13, 0), getCell(data, 13, 1), getCell(data, 13, 2), 
                 getCell(data, 13, 3), getCell(data, 13, 4), getCell(data, 13, 5), 
                 getCell(data, 13, 6), getCell(data, 13, 7), getCell(data, 13, 8)]
            ];
            
            // Render morning
            morningRows.forEach((row, index) => {
                const periodClass = index % 2 === 0 ? 'morning-odd' : 'morning-even';
                html += createRowHTML(row, periodClass);
            });
            
            // Render afternoon
            afternoonRows.forEach((row, index) => {
                const periodClass = index % 2 === 0 ? 'afternoon-odd' : 'afternoon-even';
                html += createRowHTML(row, periodClass, index === 0);
            });
            
            tbody.innerHTML = html;
        }

        // Load and render data for class 9A9
        function loadClass9A9(data) {
            const tbody = document.getElementById('tbody-9a9');
            let html = '';
            
            // Morning sessions (rows 17-21 in CSV, index 17-21)
            const morningRows = [
                [getCell(data, 17, 0), getCell(data, 17, 1), getCell(data, 17, 2), 
                 getCell(data, 17, 3), getCell(data, 17, 4), getCell(data, 17, 5), 
                 getCell(data, 17, 6), getCell(data, 17, 7), getCell(data, 17, 8)],
                [getCell(data, 18, 0), getCell(data, 18, 1), getCell(data, 18, 2), 
                 getCell(data, 18, 3), getCell(data, 18, 4), getCell(data, 18, 5), 
                 getCell(data, 18, 6), getCell(data, 18, 7), getCell(data, 18, 8)],
                [getCell(data, 19, 0), getCell(data, 19, 1), getCell(data, 19, 2), 
                 getCell(data, 19, 3), getCell(data, 19, 4), getCell(data, 19, 5), 
                 getCell(data, 19, 6), getCell(data, 19, 7), getCell(data, 19, 8)],
                [getCell(data, 20, 0), getCell(data, 20, 1), getCell(data, 20, 2), 
                 getCell(data, 20, 3), getCell(data, 20, 4), getCell(data, 20, 5), 
                 getCell(data, 20, 6), getCell(data, 20, 7), getCell(data, 20, 8)],
                [getCell(data, 21, 0), getCell(data, 21, 1), getCell(data, 21, 2), 
                 getCell(data, 21, 3), getCell(data, 21, 4), getCell(data, 21, 5), 
                 getCell(data, 21, 6), getCell(data, 21, 7), getCell(data, 21, 8)]
            ];
            
            // Afternoon sessions (rows 22-26 in CSV, index 22-26)
            const afternoonRows = [
                [getCell(data, 22, 0), getCell(data, 22, 1), getCell(data, 22, 2), 
                 getCell(data, 22, 3), getCell(data, 22, 4), getCell(data, 22, 5), 
                 getCell(data, 22, 6), getCell(data, 22, 7), getCell(data, 22, 8)],
                [getCell(data, 23, 0), getCell(data, 23, 1), getCell(data, 23, 2), 
                 getCell(data, 23, 3), getCell(data, 23, 4), getCell(data, 23, 5), 
                 getCell(data, 23, 6), getCell(data, 23, 7), getCell(data, 23, 8)],
                [getCell(data, 24, 0), getCell(data, 24, 1), getCell(data, 24, 2), 
                 getCell(data, 24, 3), getCell(data, 24, 4), getCell(data, 24, 5), 
                 getCell(data, 24, 6), getCell(data, 24, 7), getCell(data, 24, 8)],
                [getCell(data, 25, 0), getCell(data, 25, 1), getCell(data, 25, 2), 
                 getCell(data, 25, 3), getCell(data, 25, 4), getCell(data, 25, 5), 
                 getCell(data, 25, 6), getCell(data, 25, 7), getCell(data, 25, 8)],
                [getCell(data, 26, 0), getCell(data, 26, 1), getCell(data, 26, 2), 
                 getCell(data, 26, 3), getCell(data, 26, 4), getCell(data, 26, 5), 
                 getCell(data, 26, 6), getCell(data, 26, 7), getCell(data, 26, 8)]
            ];
            
            // Render morning
            morningRows.forEach((row, index) => {
                const periodClass = index % 2 === 0 ? 'morning-odd' : 'morning-even';
                html += createRowHTML(row, periodClass);
            });
            
            // Render afternoon
            afternoonRows.forEach((row, index) => {
                const periodClass = index % 2 === 0 ? 'afternoon-odd' : 'afternoon-even';
                html += createRowHTML(row, periodClass, index === 0);
            });
            
            tbody.innerHTML = html;
        }

        // Main function to fetch and update data
        async function fetchAndUpdateData() {
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('Không thể tải dữ liệu');
                
                const csvText = await response.text();
                const data = parseCSV(csvText);
                
                // Check if data has changed
                const currentHash = csvText;
                if (currentHash !== lastDataHash) {
                    lastDataHash = currentHash;
                    lastUpdateTime = new Date();
                    
                    // Update tables
                    loadClass7A6(data);
                    loadClass9A9(data);
                    
                    // Show tables, hide loading
                    document.getElementById('table-7a6').style.display = 'table';
                    document.getElementById('loading-7a6').style.display = 'none';
                    document.getElementById('table-9a9').style.display = 'table';
                    document.getElementById('loading-9a9').style.display = 'none';
                    
                    // Update last update time
                    const timeStr = lastUpdateTime.toLocaleTimeString('vi-VN');
                    document.getElementById('last-update').textContent = 
                        `Cập nhật lần cuối: ${timeStr}`;
                    
                    console.log('Data updated at', timeStr);
                }
                
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('loading-7a6').style.display = 'none';
                document.getElementById('loading-9a9').style.display = 'none';
                document.getElementById('error-7a6').style.display = 'block';
                document.getElementById('error-9a9').style.display = 'block';
                document.getElementById('error-7a6').innerHTML = 
                    `<div class="error-message">⚠️ Không thể tải dữ liệu từ Google Sheets<br>${error.message}</div>`;
                document.getElementById('error-9a9').innerHTML = 
                    `<div class="error-message">⚠️ Không thể tải dữ liệu từ Google Sheets<br>${error.message}</div>`;
                document.getElementById('last-update').textContent = 
                    'Lỗi tải dữ liệu - Vui lòng tải lại trang';
            }
        }

        // Update date and time
        function updateDateTime() {
            const now = new Date();
            const weekday = now.toLocaleDateString('vi-VN', { weekday: 'long' });
            const day = now.getDate();
            const month = now.getMonth() + 1;
            const year = now.getFullYear();
            document.getElementById('current-date').textContent = `${weekday}, ${day}/${month}/${year}`;

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${hours}:${minutes}:${seconds}`;

            calculateSchoolWeek(now);
            highlightCurrentDay(now.getDay());
        }

        function calculateSchoolWeek(currentDate) {
            const startDate = new Date(2026, 8, 7);
            startDate.setHours(0, 0, 0, 0);
            const current = new Date(currentDate);
            const dayOfWeek = current.getDay();
            const diff = current.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
            const currentMonday = new Date(current.setDate(diff));
            currentMonday.setHours(0, 0, 0, 0);
            const diffTime = currentMonday - startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const weekNumber = Math.floor(diffDays / 7) + 1;
            document.getElementById('week-number').textContent = weekNumber > 0 ? weekNumber : '—';
        }

        function highlightCurrentDay(dayOfWeek) {
            if (dayOfWeek === 0) return;
            const colIndex = dayOfWeek + 2;
            document.querySelectorAll('table').forEach(table => {
                table.querySelectorAll('th').forEach(th => th.classList.remove('current-day-header'));
                const headers = table.querySelectorAll('th');
                if (headers[colIndex]) headers[colIndex].classList.add('current-day-header');
            });
        }

        // Initialize
        function init() {
            // Fetch data immediately
            fetchAndUpdateData();
            
            // Auto-refresh every 2 minutes
            setInterval(fetchAndUpdateData, 120000);
            
            // Update clock every second
            updateDateTime();
            setInterval(updateDateTime, 1000);
        }

        // Start when page loads
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
