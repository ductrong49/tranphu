<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>📚 TKB Năm học 2026-2027</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdfbf7;
            background-image: 
                linear-gradient(#e8e8e8 1px, transparent 1px),
                linear-gradient(90deg, #e8e8e8 1px, transparent 1px);
            background-size: 20px 20px;
            color: #444;
            padding: 10px;
            line-height: 1.5;
            text-align: center;
        }

        .container { max-width: 100%; margin: 0 auto; }

        .header {
            margin-bottom: 20px;
            padding: 15px 10px;
            background: #ffffff;
            border-radius: 12px;
            border: 2px solid #e3f2fd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .header h1 {
            color: #1565c0;
            font-size: 1.5em;
            font-weight: 800;
            margin-bottom: 3px;
        }

        .header-subtitle {
            color: #64b5f6;
            font-size: 1em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .week-info {
            display: inline-block;
            background: #fff3e0;
            color: #e65100;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.95em;
            margin-bottom: 10px;
        }

        .datetime {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .date-display { font-size: 1em; font-weight: 700; color: #333; }
        .time-display { font-size: 1em; font-weight: 700; color: #e65100; }
        .datetime-separator { color: #ccc; font-weight: 300; }

        .class-section {
            margin-bottom: 25px;
            background: #ffffff;
            border-radius: 12px;
            padding: 15px 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .class-title {
            font-size: 1.3em;
            font-weight: 800;
            margin-bottom: 15px;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .class-7a6 { border-top: 4px solid #f48fb1; }
        .class-7a6 .class-title { color: #c2185b; border-bottom: 2px dashed #f8bbd0; }

        .class-9a9 { border-top: 4px solid #4fc3f7; }
        .class-9a9 .class-title { color: #0277bd; border-bottom: 2px solid #b3e5fc; }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.85em;
            margin: 0 auto;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 8px 4px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background: #f5f7fa;
            color: #546e7a;
            font-weight: 700;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .class-7a6 .session-morning {
            background-color: #ec407a !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }
        .class-9a9 .session-morning {
            background-color: #0288d1 !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }

        .class-7a6 .session-afternoon {
            background-color: #880e4f !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }
        .class-9a9 .session-afternoon {
            background-color: #01579b !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }

        .afternoon-start td {
            border-top: 4px solid #546e7a !important;
        }

        .class-7a6 .morning-odd td { background-color: #fce4ec; color: #880e4f; font-weight: 700; }
        .class-9a9 .morning-odd td { background-color: #e1f5fe; color: #01579b; font-weight: 700; }

        .class-7a6 .morning-even td,
        .class-9a9 .morning-even td { background-color: #ffffff; color: #444; font-weight: 700; }

        .class-7a6 .afternoon-odd td { background-color: #f8bbd0; color: #880e4f; font-weight: 700; }
        .class-9a9 .afternoon-odd td { background-color: #b3e5fc; color: #01579b; font-weight: 700; }

        .class-7a6 .afternoon-even td,
        .class-9a9 .afternoon-even td { background-color: #f5f5f5; color: #444; font-weight: 700; }

        .empty-cell { color: #bdbdbd !important; font-weight: 400 !important; }

        .current-day-header {
            background-color: #fff3e0 !important;
            color: #e65100 !important;
            border: 2px solid #ffb74d !important;
            font-weight: 800;
            position: relative;
        }
        .current-day-header::after {
            content: '📍';
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 0.9em;
            background: white;
            border-radius: 50%;
            padding: 2px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.1em;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #c62828;
            text-align: left;
        }

        .footer {
            margin-top: 25px;
            padding: 15px;
            color: #888;
            font-size: 0.85em;
        }

        @media (max-width: 768px) {
            body { padding: 5px; }
            .header { padding: 12px 8px; margin-bottom: 15px; }
            .header h1 { font-size: 1.2em; }
            .header-subtitle { font-size: 0.9em; }
            .week-info { font-size: 0.85em; padding: 3px 12px; }
            .datetime { gap: 10px; }
            .date-display, .time-display { font-size: 0.85em; }
            .class-section { padding: 10px 5px; margin-bottom: 20px; }
            .class-title { font-size: 1.1em; margin-bottom: 10px; }
            table { font-size: 0.7em; }
            th, td { padding: 6px 2px; }
            .footer { font-size: 0.75em; padding: 10px; }
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.1em; }
            table { font-size: 0.65em; }
            th, td { padding: 5px 1px; }
            .datetime { flex-direction: column; gap: 5px; }
            .datetime-separator { display: none; }
        }

        @media print {
            body { background: white; padding: 0; }
            .class-section, .header { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Thời Khóa Biểu</h1>
            <div class="header-subtitle">Năm học 2026 - 2027</div>
            <div class="week-info">Tuần <span id="week-number">1</span></div>
            <div class="datetime">
                <div class="date-display" id="current-date">--</div>
                <span class="datetime-separator">•</span>
                <div class="time-display" id="current-time">--</div>
            </div>
        </div>

        <!-- Lớp 7A6 -->
        <div class="class-section class-7a6">
            <h2 class="class-title">🌸 Lớp 7A6</h2>
            <div class="table-wrapper">
                <div id="loading-7a6" class="loading">Đang tải dữ liệu</div>
                <table id="table-7a6" style="display: none;">
                    <thead>
                        <tr>
                            <th>Buổi</th>
                            <th>Tiết</th>
                            <th>Giờ</th>
                            <th>T2</th>
                            <th>T3</th>
                            <th>T4</th>
                            <th>T5</th>
                            <th>T6</th>
                            <th>T7</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-7a6"></tbody>
                </table>
                <div id="error-7a6" style="display: none;"></div>
            </div>
        </div>

        <!-- Lớp 9A9 -->
        <div class="class-section class-9a9">
            <h2 class="class-title">🚀 Lớp 9A9</h2>
            <div class="table-wrapper">
                <div id="loading-9a9" class="loading">Đang tải dữ liệu</div>
                <table id="table-9a9" style="display: none;">
                    <thead>
                        <tr>
                            <th>Buổi</th>
                            <th>Tiết</th>
                            <th>Giờ</th>
                            <th>T2</th>
                            <th>T3</th>
                            <th>T4</th>
                            <th>T5</th>
                            <th>T6</th>
                            <th>T7</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-9a9"></tbody>
                </table>
                <div id="error-9a9" style="display: none;"></div>
            </div>
        </div>

        <div class="footer">
            <p>🌟 MỤC TIÊU HỌC SINH XUẤT SẮC!</p>
            <p>Năm học 2026-2027</p>
        </div>
    </div>

    <script>
        // ===== 1. CẤU HÌNH GOOGLE SHEETS =====
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSPcpB9A2glEjMqqQpekznvgWJ1jcvif5rYOhTVkCbI6yrMVj7hD1wyNqXeCSyWx0Tcmc9-PlbC9LQO/pub?gid=859933321&single=true&output=csv';
        
        // ===== 2. CẤU HÌNH VÙNG DỮ LIỆU (1-based indexing: Dòng 1 = 1, Cột A = 1) =====
        const DATA_RANGES = {
            '7a6': {
                morning:    { startRow: 5, endRow: 9,  startCol: 2, endCol: 9 }, // Dòng 5-9, Cột C-J
                afternoon:  { startRow: 9, endRow: 13, startCol: 2, endCol: 9 } // Dòng 10-14, Cột C-J
            },
            '9a9': {
                morning:    { startRow: 17, endRow: 21, startCol: 2, endCol: 9 }, // Dòng 19-23, Cột C-J
                afternoon:  { startRow: 22, endRow: 26, startCol: 2, endCol: 9 }  // Dòng 24-28, Cột C-J
            }
        };
        
        let lastDataHash = '';

        // ===== 3. HÀM XỬ LÝ DỮ LIỆU =====
        function parseCSV(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line);
            const result = [];
            
            for (let line of lines) {
                const row = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                row.push(current.trim());
                result.push(row);
            }
            return result;
        }

        function getCellValue(data, sheetRow, sheetCol) {
            const csvRow = sheetRow - 1; 
            const csvCol = sheetCol - 1; 
            
            if (data[csvRow] && data[csvRow][csvCol] !== undefined) {
                return data[csvRow][csvCol].trim();
            }
            return '';
        }

        function isEmpty(value) {
            return !value || value === '' || value === '-' || value === '​'; 
        }

        function createPeriodRowHTML(cells, periodClass, isAfternoonStart = false) {
            const rowClass = isAfternoonStart ? `${periodClass} afternoon-start` : periodClass;
            let html = `<tr class="${rowClass}">`;
            
            cells.forEach(cell => {
                html += isEmpty(cell) ? `<td class="empty-cell">-</td>` : `<td>${cell}</td>`;
            });
            
            html += '</tr>';
            return html;
        }

        // ===== 4. RENDER BẢNG =====
        function renderClassTable(classId, data) {
            const tbody = document.getElementById(`tbody-${classId}`);
            const ranges = DATA_RANGES[classId];
            let html = '';
            
            // Render Buổi Sáng
            for (let i = 0; i < 5; i++) {
                const sheetRow = ranges.morning.startRow + i;
                const cells = [];
                for (let col = ranges.morning.startCol; col <= ranges.morning.endCol; col++) {
                    cells.push(getCellValue(data, sheetRow, col));
                }
                
                const periodClass = i % 2 === 0 ? 'morning-odd' : 'morning-even';
                
                if (i === 0) {
                    html += `<tr class="${periodClass}">`;
                    html += `<td rowspan="5" class="session-morning">Sáng</td>`;
                    cells.forEach(cell => {
                        html += isEmpty(cell) ? `<td class="empty-cell">-</td>` : `<td>${cell}</td>`;
                    });
                    html += '</tr>';
                } else {
                    html += createPeriodRowHTML(cells, periodClass);
                }
            }
            
            // Render Buổi Chiều
            for (let i = 0; i < 5; i++) {
                const sheetRow = ranges.afternoon.startRow + i;
                const cells = [];
                for (let col = ranges.afternoon.startCol; col <= ranges.afternoon.endCol; col++) {
                    cells.push(getCellValue(data, sheetRow, col));
                }
                
                const periodClass = i % 2 === 0 ? 'afternoon-odd' : 'afternoon-even';
                
                if (i === 0) {
                    html += `<tr class="${periodClass} afternoon-start">`;
                    html += `<td rowspan="5" class="session-afternoon">Chiều</td>`;
                    cells.forEach(cell => {
                        html += isEmpty(cell) ? `<td class="empty-cell">-</td>` : `<td>${cell}</td>`;
                    });
                    html += '</tr>';
                } else {
                    html += createPeriodRowHTML(cells, periodClass, false);
                }
            }
            
            tbody.innerHTML = html;
        }

        // ===== 5. FETCH & UPDATE =====
        async function fetchAndUpdateData() {
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const csvText = await response.text();
                
                // Chỉ render nếu dữ liệu thay đổi
                if (csvText !== lastDataHash) {
                    lastDataHash = csvText;
                    const data = parseCSV(csvText);
                    
                    renderClassTable('7a6', data);
                    renderClassTable('9a9', data);
                    
                    document.getElementById('table-7a6').style.display = 'table';
                    document.getElementById('loading-7a6').style.display = 'none';
                    document.getElementById('table-9a9').style.display = 'table';
                    document.getElementById('loading-9a9').style.display = 'none';
                    
                    console.log('✅ Dữ liệu đã được cập nhật tự động.');
                    highlightCurrentDay(new Date().getDay());
                }
            } catch (error) {
                console.error('❌ Lỗi tải dữ liệu:', error);
                document.getElementById('loading-7a6').style.display = 'none';
                document.getElementById('loading-9a9').style.display = 'none';
                
                const errorMsg = `<div class="error-message">⚠️ Không thể tải dữ liệu từ Google Sheets.<br><small>${error.message}</small><br>Vui lòng kiểm tra kết nối mạng hoặc quyền chia sẻ Sheet.</div>`;
                
                document.getElementById('error-7a6').style.display = 'block';
                document.getElementById('error-7a6').innerHTML = errorMsg;
                document.getElementById('error-9a9').style.display = 'block';
                document.getElementById('error-9a9').innerHTML = errorMsg;
            }
        }

        // ===== 6. TIỆN ÍCH NGÀY GIỜ =====
        function updateDateTime() {
            const now = new Date();
            const weekday = now.toLocaleDateString('vi-VN', { weekday: 'long' });
            const day = now.getDate();
            const month = now.getMonth() + 1;
            const year = now.getFullYear();
            document.getElementById('current-date').textContent = `${weekday}, ${day}/${month}/${year}`;

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${hours}:${minutes}:${seconds}`;

            calculateSchoolWeek(now);
        }

        function calculateSchoolWeek(currentDate) {
            const startDate = new Date(2026, 8, 7); // 7/9/2026
            startDate.setHours(0, 0, 0, 0);
            
            const current = new Date(currentDate);
            const dayOfWeek = current.getDay();
            const diff = current.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
            const currentMonday = new Date(current.setDate(diff));
            currentMonday.setHours(0, 0, 0, 0);
            
            const diffTime = currentMonday - startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const weekNumber = Math.floor(diffDays / 7) + 1;
            
            document.getElementById('week-number').textContent = weekNumber > 0 ? weekNumber : '—';
        }

        function highlightCurrentDay(dayOfWeek) {
            if (dayOfWeek === 0) return; // Bỏ qua Chủ Nhật
            const colIndex = dayOfWeek + 2; // T2=3, T3=4, ..., T7=8
            
            document.querySelectorAll('table').forEach(table => {
                table.querySelectorAll('th').forEach(th => th.classList.remove('current-day-header'));
                const headers = table.querySelectorAll('th');
                if (headers[colIndex]) {
                    headers[colIndex].classList.add('current-day-header');
                }
            });
        }

        // ===== 7. KHỞI TẠO =====
        function init() {
            fetchAndUpdateData();
            setInterval(fetchAndUpdateData, 120000); // Tự động kiểm tra cập nhật mỗi 2 phút
            
            updateDateTime();
            setInterval(updateDateTime, 1000); // Cập nhật đồng hồ mỗi giây
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
